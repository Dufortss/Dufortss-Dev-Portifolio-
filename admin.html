<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dufort // Moderação</title><link rel="stylesheet" href="style.css"></head><body><main class="section" style="max-width:900px"><div class="section-label">ADMIN / MODERAÇÃO</div><h1 style="font-size:55px;letter-spacing:-3px;margin:25px 0">Comentários<span>.</span></h1><p style="color:#9a91a8;margin-bottom:25px">Use seu token secreto. Ele nunca deve ser colocado no código público do site.</p><input id="token" placeholder="ADMIN_TOKEN" style="width:100%;padding:14px;background:#09070d;border:1px solid rgba(174,113,255,.2);color:white;margin-bottom:20px"><div id="adminList"></div></main><script>const token=()=>document.querySelector('#token').value;async function load(){const r=await fetch('/api/comments');const cs=await r.json();document.querySelector('#adminList').innerHTML=cs.map(c=>`<article class="comment-card" style="margin-bottom:14px"><strong>${String(c.name).replace(/[<>]/g,'')}</strong><small style="display:block;color:#6f6479">${new Date(c.createdAt).toLocaleString('pt-BR')}</small><p class="comment-text">${String(c.idea).replace(/[<>]/g,'')}</p><button class="btn primary" onclick="del('${c.id}')">EXCLUIR</button><button class="btn ghost" onclick="replyTo('${c.id}')">RESPONDER</button></article>`).join('')||'<div class="empty">Nenhum comentário.</div>'}async function del(id){if(!confirm('Excluir esta ideia?'))return;const r=await fetch('/api/comments/'+id,{method:'DELETE',headers:{Authorization:'Bearer '+token()}});if(!r.ok)return alert('Token inválido ou erro.');load()}async function replyTo(id){const text=prompt('Sua resposta:');if(!text)return;const r=await fetch('/api/comments/'+id+'/reply',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify({reply:text})});if(!r.ok)return alert('Token inválido ou erro.');load()}load();</script></body></html>
